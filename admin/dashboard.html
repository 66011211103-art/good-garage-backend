<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แดชบอร์ด — Good Garage Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin-shell.css">
<style>
  .grid-2col { display: grid; grid-template-columns: 1.6fr 1fr; gap: 18px; margin-bottom: 20px; }
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .satisfaction-score { font-size: 32px; font-weight: 800; color: var(--text-main); }
  .satisfaction-stars { color: var(--warning); font-size: 18px; letter-spacing: 2px; margin-top: 4px; }
  .bar-row { display: flex; align-items: flex-end; gap: 8px; height: 90px; }
  .bar-row .bar { flex: 1; background: var(--success); border-radius: 4px 4px 0 0; min-height: 4px; }
</style>
</head>
<body>
  <aside class="sidebar" id="sidebarMount"></aside>

  <div class="main-wrap">
    <div class="appbar" id="appbarMount"></div>

    <main class="main">
      <div class="topbar">
        <div>
          <h1>แดชบอร์ด</h1>
          <p>ภาพรวมข้อมูลผู้ใช้งาน อู่ซ่อมรถ และงานซ่อมทั้งหมดในแพลตฟอร์ม</p>
        </div>
      </div>

      <div class="stat-grid">
        <div class="stat-card">
          <div class="icon-badge badge-purple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke-linecap="round"/></svg></div>
          <div class="value" id="statCustomers">—</div>
          <div class="label">ผู้ใช้งานทั้งหมด</div>
          <div class="trend" id="trendCustomers"></div>
        </div>
        <div class="stat-card">
          <div class="icon-badge badge-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 21V9l9-6 9 6v12" stroke-linejoin="round"/><path d="M9 21v-7h6v7"/></svg></div>
          <div class="value" id="statGarages">—</div>
          <div class="label">อู่ซ่อมทั้งหมด</div>
          <div class="trend" id="trendGarages"></div>
        </div>
        <div class="stat-card">
          <div class="icon-badge badge-amber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 17H4v-2a5 5 0 0 1 5-5h1M15 17h5v-2a5 5 0 0 0-5-5h-1M12 12V4m0 0-3 3m3-3 3 3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="value" id="statRequests">—</div>
          <div class="label">คำขอซ่อม</div>
          <div class="trend" id="trendRequests"></div>
        </div>
        <div class="stat-card">
          <div class="icon-badge badge-green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" stroke-linecap="round"/></svg></div>
          <div class="value" id="statRevenue">—</div>
          <div class="label">รายได้รวม</div>
          <div class="trend" id="trendRevenue"></div>
        </div>
      </div>

      <div class="grid-2col">
        <div class="chart-card">
          <h3>สถิติผู้ใช้และงานซ่อมรายเดือน</h3>
          <div class="chart-legend">
            <span><span class="dot" style="background:var(--accent-1)"></span>ผู้ใช้ใหม่</span>
            <span><span class="dot" style="background:var(--warning)"></span>คำขอซ่อม</span>
          </div>
          <svg id="lineChart" viewBox="0 0 600 200" style="width:100%;height:200px;" preserveAspectRatio="none"></svg>
          <div class="axis-labels" id="lineAxis"></div>
        </div>

        <div class="stack">
          <div class="chart-card">
            <h3>รายได้รายเดือน</h3>
            <div class="bar-row" id="revenueBars"></div>
            <div class="axis-labels" id="revenueAxis"></div>
          </div>
          <div class="chart-card">
            <h3>อัตราความพึงพอใจ</h3>
            <div class="satisfaction-score" id="satisfactionScore">—</div>
            <div class="satisfaction-stars" id="satisfactionStars">☆☆☆☆☆</div>
          </div>
        </div>
      </div>

      <div class="table-card">
        <table>
          <thead><tr><th>ผู้ใช้</th><th>การกระทำ</th><th>วันที่</th><th>สถานะ</th></tr></thead>
          <tbody id="activityTbody"><tr><td colspan="4" class="empty-row">กำลังโหลด...</td></tr></tbody>
        </table>
      </div>
    </main>
  </div>

<script src="admin-shell.js"></script>
<script>
  requireAdmin();
  mountSidebar('dashboard');
  mountAppbar();

  const API_BASE = window.location.origin + '/api';

  const statusMeta = {
    'สำเร็จ': 'success', 'รอดำเนินการ': 'warning', 'ยกเลิก': 'danger', 'ปฏิเสธ': 'danger',
  };

  function fmtMoney(n) {
    return '฿' + Number(n || 0).toLocaleString('th-TH', { maximumFractionDigits: 0 });
  }

  function trendHtml(pct) {
    if (!pct || pct <= 0) return '<span class="muted" style="font-size:11.5px;">ไม่มีข้อมูลเดือนนี้</span>';
    return `↗ เพิ่มขึ้น ${pct}% เดือนนี้`;
  }

  async function loadStats() {
    try {
      const res = await fetch(`${API_BASE}/admin/dashboard-stats`);
      const data = await res.json();
      if (!data.success) return;
      const s = data.data;
      document.getElementById('statCustomers').textContent = s.totalCustomers ?? 0;
      document.getElementById('statGarages').textContent = s.totalGarages ?? 0;
      document.getElementById('statRequests').textContent = s.totalRepairRequests ?? 0;
      document.getElementById('statRevenue').textContent = fmtMoney(s.totalRevenue);

      document.getElementById('trendCustomers').innerHTML = trendHtml(s.customerGrowthPct);
      document.getElementById('trendGarages').innerHTML = trendHtml(s.garageGrowthPct);
      document.getElementById('trendRequests').innerHTML = trendHtml(s.requestGrowthPct);
      document.getElementById('trendRevenue').innerHTML = trendHtml(s.revenueGrowthPct);

      document.getElementById('satisfactionScore').textContent = s.avgSatisfaction;
      const rounded = Math.round(Number(s.avgSatisfaction));
      document.getElementById('satisfactionStars').textContent = '★'.repeat(rounded) + '☆'.repeat(5 - rounded);
    } catch (err) {
      console.error('โหลดสถิติไม่สำเร็จ', err);
    }
  }

  function monthLabel(bucket) {
    // bucket = 'YYYY-MM'
    const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
    const m = Number(bucket.split('-')[1]) - 1;
    return months[m] || bucket;
  }

  function drawLineChart(usersData, repairsData) {
    const svg = document.getElementById('lineChart');
    const axis = document.getElementById('lineAxis');
    svg.innerHTML = ''; axis.innerHTML = '';

    const buckets = [...new Set([...usersData.map(d => d.bucket), ...repairsData.map(d => d.bucket)])].sort();
    if (buckets.length === 0) {
      svg.innerHTML = '<text x="300" y="100" fill="#9ca3af" font-size="13" text-anchor="middle">ยังไม่มีข้อมูลในช่วงนี้</text>';
      return;
    }

    const usersMap = Object.fromEntries(usersData.map(d => [d.bucket, d.count]));
    const repairsMap = Object.fromEntries(repairsData.map(d => [d.bucket, d.count]));
    const maxVal = Math.max(...buckets.map(b => Math.max(usersMap[b] || 0, repairsMap[b] || 0)), 1);

    const w = 600, h = 200, pad = 12;
    const stepX = buckets.length > 1 ? (w - pad * 2) / (buckets.length - 1) : 0;
    const yFor = (val) => h - pad - ((val / maxVal) * (h - pad * 2));

    const line = (dataMap, color) => {
      const pts = buckets.map((b, i) => `${pad + stepX * i},${yFor(dataMap[b] || 0)}`).join(' ');
      return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    };
    const dots = (dataMap, color) => buckets.map((b, i) =>
      `<circle cx="${pad + stepX * i}" cy="${yFor(dataMap[b] || 0)}" r="3" fill="${color}"/>`
    ).join('');

    svg.innerHTML = line(usersMap, '#7c6cf0') + dots(usersMap, '#7c6cf0') + line(repairsMap, '#f59e0b') + dots(repairsMap, '#f59e0b');
    axis.innerHTML = buckets.map(b => `<span>${monthLabel(b)}</span>`).join('');
  }

  function drawRevenueBars(revenueData) {
    const container = document.getElementById('revenueBars');
    const axis = document.getElementById('revenueAxis');
    container.innerHTML = ''; axis.innerHTML = '';

    if (revenueData.length === 0) {
      container.innerHTML = '<div class="muted" style="font-size:12px;margin:auto;">ยังไม่มีข้อมูล</div>';
      return;
    }
    const maxVal = Math.max(...revenueData.map(d => Number(d.total)), 1);
    container.innerHTML = revenueData.map(d => {
      const pct = Math.max((Number(d.total) / maxVal) * 100, 3);
      return `<div class="bar" style="height:${pct}%;" title="${fmtMoney(d.total)}"></div>`;
    }).join('');
    axis.innerHTML = revenueData.map(d => `<span>${monthLabel(d.bucket)}</span>`).join('');
  }

  async function loadCharts() {
    try {
      const res = await fetch(`${API_BASE}/admin/dashboard-charts`);
      const data = await res.json();
      if (!data.success) return;
      drawLineChart(data.data.users, data.data.repairs);
      drawRevenueBars(data.data.revenue);
    } catch (err) {
      console.error('โหลดกราฟไม่สำเร็จ', err);
    }
  }

  async function loadActivity() {
    try {
      const res = await fetch(`${API_BASE}/admin/activity-feed`);
      const data = await res.json();
      const tbody = document.getElementById('activityTbody');
      if (!data.success || !data.data.activity.length) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty-row">ยังไม่มีกิจกรรมในระบบ</td></tr>';
        return;
      }
      tbody.innerHTML = data.data.activity.map(a => `
        <tr>
          <td>${escapeHtml(a.user_name || '-')}</td>
          <td class="muted">${escapeHtml(a.action)}</td>
          <td class="muted">${formatDate(a.at)}</td>
          <td>${badge(a.status, statusMeta[a.status] || 'info')}</td>
        </tr>`).join('');
    } catch (err) {
      console.error('โหลดกิจกรรมไม่สำเร็จ', err);
    }
  }

  loadStats();
  loadCharts();
  loadActivity();
</script>
</body>
</html>
