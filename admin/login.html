<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบผู้ดูแล — Good Garage Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #0c0a17;
    --bg-1: #171330;
    --card-bg: rgba(28, 24, 51, 0.6);
    --card-border: rgba(255, 255, 255, 0.08);
    --accent-1: #7c6cf0;
    --accent-2: #4f7cf6;
    --text-main: #f3f2fa;
    --text-mute: #9791b8;
    --text-faint: #6c6690;
    --success: #34d399;
    --danger: #f87171;
    --input-bg: rgba(255, 255, 255, 0.04);
    --input-border: rgba(255, 255, 255, 0.09);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Noto Sans Thai', 'Inter', sans-serif;
    background: radial-gradient(circle at 50% 0%, #241b47 0%, var(--bg-1) 38%, var(--bg-0) 100%);
    color: var(--text-main);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    position: relative;
    overflow-x: hidden;
  }

  /* แสงฟุ้งด้านหลังการ์ด ให้บรรยากาศเหมือนแผงควบคุมยามค่ำคืน */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 420px; height: 420px;
    background: var(--accent-1);
    top: -120px; left: 50%;
    transform: translateX(-60%);
  }
  body::after {
    width: 380px; height: 380px;
    background: var(--accent-2);
    bottom: -140px; right: 10%;
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 40px 36px 32px;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
    animation: rise .5s cubic-bezier(.16,1,.3,1);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 28px;
  }

  .brand-icon {
    position: relative;
    width: 60px; height: 60px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 28px -8px rgba(124, 108, 240, 0.55);
    margin-bottom: 14px;
  }
  .brand-icon svg { width: 30px; height: 30px; }

  /* ตราโล่เช็คถูก ลอยเป็นลายน้ำจางๆ ด้านหลังไอคอนหลัก — สื่อถึง "ผู้ดูแลที่ตรวจสอบ/อนุมัติ" */
  .brand-shield {
    position: absolute;
    top: -14px; right: -34px;
    width: 46px; height: 46px;
    opacity: 0.14;
  }

  .eyebrow {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: var(--accent-1);
    margin-bottom: 8px;
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 6px;
  }

  .subtitle {
    font-size: 13px;
    color: var(--text-mute);
    margin: 0;
  }

  form { margin-top: 4px; }

  .field { margin-bottom: 16px; }

  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-mute);
    margin-bottom: 7px;
  }

  .input-shell {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-shell svg.leading {
    position: absolute;
    left: 14px;
    width: 16px; height: 16px;
    color: var(--text-faint);
    pointer-events: none;
  }

  input[type="email"], input[type="password"], input[type="text"] {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 12px;
    padding: 12px 14px 12px 40px;
    font-family: inherit;
    font-size: 14px;
    color: var(--text-main);
    outline: none;
    transition: border-color .15s, background .15s;
  }

  input::placeholder { color: var(--text-faint); }

  input:focus {
    border-color: var(--accent-1);
    background: rgba(124, 108, 240, 0.06);
  }

  .toggle-pass {
    position: absolute;
    right: 12px;
    background: none;
    border: none;
    color: var(--text-faint);
    cursor: pointer;
    padding: 4px;
    display: flex;
  }
  .toggle-pass:hover { color: var(--text-mute); }

  .row-between {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 20px;
  }

  a.link {
    font-size: 12.5px;
    color: var(--accent-2);
    text-decoration: none;
  }
  a.link:hover { text-decoration: underline; }

  button.submit {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 13px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    color: white;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform .12s, box-shadow .12s, opacity .15s;
    box-shadow: 0 14px 30px -10px rgba(79, 124, 246, 0.55);
  }
  button.submit:hover { transform: translateY(-1px); box-shadow: 0 18px 34px -10px rgba(79, 124, 246, 0.7); }
  button.submit:active { transform: translateY(0); }
  button.submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .error-banner {
    display: none;
    align-items: center;
    gap: 8px;
    background: rgba(248, 113, 113, 0.1);
    border: 1px solid rgba(248, 113, 113, 0.25);
    color: var(--danger);
    font-size: 12.5px;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 16px;
  }
  .error-banner.show { display: flex; }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0 18px;
    color: var(--text-faint);
    font-size: 12px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--card-border);
  }

  .support {
    text-align: center;
    font-size: 12.5px;
    color: var(--text-mute);
    margin: 0 0 18px;
  }

  .secure-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 12px;
    color: var(--success);
    font-weight: 500;
  }

  .footer {
    text-align: center;
    font-size: 11.5px;
    color: var(--text-faint);
    margin-top: 14px;
  }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
  }
</style>
</head>
<body>

  <div class="wrap">
    <div class="card">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="eyebrow">ADMIN PANEL</div>
        <h1>เข้าสู่ระบบผู้ดูแล</h1>
        <p class="subtitle">ระบบจัดการแพลตฟอร์มค้นหาอู่ซ่อมรถ</p>
      </div>

      <div id="errorBanner" class="error-banner">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 9v4m0 4h.01M10.29 3.86l-8.18 14.18A1.5 1.5 0 0 0 3.4 20.5h17.2a1.5 1.5 0 0 0 1.3-2.46L13.71 3.86a1.5 1.5 0 0 0-2.62 0z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="errorText">อีเมลหรือรหัสผ่านไม่ถูกต้อง</span>
      </div>

      <form id="loginForm">
        <div class="field">
          <label for="email">อีเมล</label>
          <div class="input-shell">
            <svg class="leading" viewBox="0 0 24 24" fill="none"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h13A2.5 2.5 0 0 1 21 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5v-11z" stroke="currentColor" stroke-width="1.5"/><path d="m4 7 7.4 5.2a1 1 0 0 0 1.2 0L20 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <input type="email" id="email" name="email" placeholder="admin@example.com" autocomplete="username" required>
          </div>
        </div>

        <div class="field">
          <label for="password">รหัสผ่าน</label>
          <div class="input-shell">
            <svg class="leading" viewBox="0 0 24 24" fill="none"><rect x="4" y="10" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M8 10V7a4 4 0 1 1 8 0v3" stroke="currentColor" stroke-width="1.5"/></svg>
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="toggle-pass" id="togglePass" aria-label="แสดงรหัสผ่าน">
              <svg id="eyeIcon" width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/></svg>
            </button>
          </div>
        </div>

        <div class="row-between">
          <a href="#" class="link">ลืมรหัสผ่าน?</a>
        </div>

        <button type="submit" class="submit" id="submitBtn">
          <span id="submitLabel">เข้าสู่ระบบ</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12h14m0 0-6-6m6 6-6 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>

      <div class="divider">หรือ</div>
      <p class="support">ต้องการความช่วยเหลือ? <a href="#" class="link">ติดต่อฝ่ายสนับสนุน</a></p>
      <div class="secure-badge">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><rect x="4" y="10" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 10V7a4 4 0 1 1 8 0v3" stroke="currentColor" stroke-width="1.6"/></svg>
        Secure Login
      </div>
    </div>
    <p class="footer">© 2026 Good Garage Platform. All rights reserved.</p>
  </div>

<script>
  // ⚠️ เปลี่ยนเป็น URL จริงของ server ตอน deploy — ตอนนี้ตั้งเป็น origin ปัจจุบัน
  // (ถ้าเปิดหน้านี้ผ่าน http://<ip>:3000/admin/login.html ก็จะยิง API ไปที่เซิร์ฟเวอร์เดียวกันอัตโนมัติ)
  const API_BASE = window.location.origin + '/api';

  const form = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submitBtn');
  const submitLabel = document.getElementById('submitLabel');
  const errorBanner = document.getElementById('errorBanner');
  const errorText = document.getElementById('errorText');

  // สลับโชว์/ซ่อนรหัสผ่าน
  document.getElementById('togglePass').addEventListener('click', () => {
    const pass = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    const isHidden = pass.type === 'password';
    pass.type = isHidden ? 'text' : 'password';
    eyeIcon.innerHTML = isHidden
      ? '<path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 8 11 8a17.6 17.6 0 0 1-3.1 4.14M6.6 6.6C3.5 8.5 1 12 1 12s4 8 11 8a10.6 10.6 0 0 0 5-1.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>'
      : '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/>';
  });

  function showError(message) {
    errorText.textContent = message;
    errorBanner.classList.add('show');
  }

  function hideError() {
    errorBanner.classList.remove('show');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    submitBtn.disabled = true;
    submitLabel.textContent = 'กำลังเข้าสู่ระบบ...';

    try {
      const res = await fetch(`${API_BASE}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();

      if (!data.success) {
        showError(data.message || 'เข้าสู่ระบบไม่สำเร็จ');
        return;
      }

      // ✅ ต้องเป็นบัญชี user_type = 'admin' เท่านั้น — กันบัญชีลูกค้า/อู่มา login หน้านี้
      if (data.data.user.userType !== 'admin') {
        showError('บัญชีนี้ไม่มีสิทธิ์เข้าหน้าผู้ดูแลระบบ');
        return;
      }

      sessionStorage.setItem('adminUser', JSON.stringify(data.data.user));
      window.location.href = 'dashboard.html';
    } catch (err) {
      showError('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาลองใหม่');
    } finally {
      submitBtn.disabled = false;
      submitLabel.textContent = 'เข้าสู่ระบบ';
    }
  });
</script>

</body>
</html>
