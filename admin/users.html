<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จัดการผู้ใช้งาน — Good Garage Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin-shell.css">
</head>
<body>
  <aside class="sidebar" id="sidebarMount"></aside>

  <div class="main-wrap">
    <div class="appbar" id="appbarMount"></div>

    <main class="main">
    <div class="topbar">
      <div>
        <h1>บัญชีผู้ใช้งาน</h1>
        <p>จัดการบัญชีลูกค้า อู่ซ่อม ช่าง และผู้ดูแลระบบทั้งหมด</p>
      </div>
      <input id="searchInput" class="search-input" placeholder="ค้นหาชื่อ, อีเมล...">
    </div>

    <div class="stat-grid" id="summaryGrid">
      <div class="stat-card"><div class="value" id="sumTotal">—</div><div class="label">ผู้ใช้ทั้งหมด</div></div>
      <div class="stat-card"><div class="value" id="sumCustomer">—</div><div class="label">ลูกค้า</div></div>
      <div class="stat-card"><div class="value" id="sumGarage">—</div><div class="label">เจ้าของอู่</div></div>
      <div class="stat-card"><div class="value" id="sumSuspended" style="color:var(--danger)">—</div><div class="label">ถูกระงับ</div></div>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>ID</th><th>ชื่อ</th><th>อีเมล</th><th>บทบาท</th><th>สถานะ</th><th>วันที่สมัคร</th><th>การดำเนินการ</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="7" class="empty-row">กำลังโหลด...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
  </div>

<script src="admin-shell.js"></script>
<script>
  requireAdmin();
  mountSidebar('users');
  mountAppbar();

  const API_BASE = window.location.origin + '/api';
  let allUsers = [];

  const roleLabel = { customer: 'ลูกค้า', repair: 'เจ้าของอู่', technician: 'ช่าง', admin: 'ผู้ดูแลระบบ' };

  function render() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const rows = allUsers.filter(u =>
      (u.display_name || '').toLowerCase().includes(q) || (u.email || '').toLowerCase().includes(q)
    );

    document.getElementById('sumTotal').textContent = allUsers.length;
    document.getElementById('sumCustomer').textContent = allUsers.filter(u => u.user_type === 'customer').length;
    document.getElementById('sumGarage').textContent = allUsers.filter(u => u.user_type === 'repair').length;
    document.getElementById('sumSuspended').textContent = allUsers.filter(u => u.status === 'suspended').length;

    const tbody = document.getElementById('tbody');
    if (rows.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty-row">ไม่พบผู้ใช้ที่ค้นหา</td></tr>';
      return;
    }

    tbody.innerHTML = rows.map(u => {
      const suspended = u.status === 'suspended';
      // ✅ เพิ่มใหม่: บัญชีช่างที่ถูกลบ (soft delete — technicians.status = 'deleted')
      // ต้องโชว์ต่างจาก "ระงับ" ปกติ และไม่ให้กดระงับ/ลบซ้ำได้อีก เพราะลบไปแล้วจริงๆ
      // (ข้อมูลชื่อยังอยู่ในตารางแค่เพื่อรักษาความสัมพันธ์กับประวัติงานซ่อมเก่าเท่านั้น)
      const techDeleted = u.user_type === 'technician' && u.technician_status === 'deleted';

      const statusCell = techDeleted
        ? badge('ลบแล้ว', 'muted')
        : badge(suspended ? 'ระงับ' : 'ใช้งาน', suspended ? 'danger' : 'success');

      const actionsCell = techDeleted
        ? `<span class="muted">—</span>`
        : `
            <button class="btn-mini btn-blue" onclick="openEditModal(${u.id})">แก้ไข</button>
            <button class="btn-mini btn-amber" onclick="toggleStatus(${u.id}, '${suspended ? 'active' : 'suspended'}')">${suspended ? 'ปลดระงับ' : 'ระงับ'}</button>
            <button class="btn-mini btn-red" onclick="removeUser(${u.id})">ลบ</button>
          `;

      return `
        <tr>
          <td class="mono">#${u.id}</td>
          <td>${escapeHtml(u.display_name || '-')}</td>
          <td class="muted">${escapeHtml(u.email)}</td>
          <td>${roleLabel[u.user_type] || u.user_type}</td>
          <td>${statusCell}</td>
          <td class="muted">${formatDate(u.created_at)}</td>
          <td class="actions">${actionsCell}</td>
        </tr>`;
    }).join('');
  }

  async function loadUsers() {
    try {
      const res = await fetch(`${API_BASE}/admin/users`);
      const data = await res.json();
      if (data.success) {
        allUsers = data.data.users;
        render();
      }
    } catch (e) {
      document.getElementById('tbody').innerHTML = '<tr><td colspan="7" class="empty-row">โหลดข้อมูลไม่สำเร็จ — เชื่อมต่อเซิร์ฟเวอร์ไม่ได้</td></tr>';
    }
  }

  async function toggleStatus(id, newStatus) {
    // ✅ เพิ่มใหม่: ตอนกด "ระงับ" ต้องถามสาเหตุก่อนเสมอ — สาเหตุนี้จะถูกส่งไปโชว์ให้
    // ผู้ใช้เห็นตอนพยายามล็อกอิน (ดู /api/auth/login ใน server.js) ไม่ใช่แค่เปลี่ยน
    // สถานะเฉยๆ แบบเดิมอีกต่อไป ตอน "ปลดระงับ" ไม่ต้องถาม เพราะสาเหตุจะถูกล้างอัตโนมัติ
    let reason = null;
    if (newStatus === 'suspended') {
      reason = prompt('กรุณาระบุสาเหตุที่ระงับบัญชีนี้\n(ผู้ใช้จะเห็นข้อความนี้ตอนพยายามล็อกอินเข้าแอป):');
      if (reason === null) return; // กดยกเลิก -> ไม่ทำอะไรต่อ
      if (!reason.trim()) {
        toast('กรุณาระบุสาเหตุก่อนระงับบัญชี', false);
        return;
      }
    }
    const res = await fetch(`${API_BASE}/admin/users/${id}/status`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: newStatus, reason }),
    });
    const data = await res.json();
    toast(data.message, data.success);
    if (data.success) loadUsers();
  }

  async function removeUser(id) {
    if (!confirm('ยืนยันลบบัญชีนี้ถาวร? การกระทำนี้ย้อนกลับไม่ได้')) return;
    const res = await fetch(`${API_BASE}/admin/users/${id}`, { method: 'DELETE' });
    const data = await res.json();
    toast(data.message, data.success);
    if (data.success) loadUsers();
  }

  // ✅ เพิ่มใหม่: แก้ไขข้อมูลบัญชีผู้ใช้งานโดยตรง (ข้อ 1.3.4.2) — เดิมทำได้แค่ระงับ/ลบเท่านั้น
  // บัญชี admin ไม่มีตารางโปรไฟล์แยก เลยซ่อนช่องชื่อ/เบอร์ ให้แก้ได้แค่อีเมล
  function openEditModal(id) {
    const u = allUsers.find(x => x.id === id);
    if (!u) return;
    closeEditModal();
    const isAdmin = u.user_type === 'admin';
    const overlay = document.createElement('div');
    overlay.id = 'editUserOverlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(15,15,25,0.45);display:flex;align-items:center;justify-content:center;z-index:80;';
    overlay.innerHTML = `
      <div style="background:var(--panel);border-radius:16px;padding:24px;width:380px;max-width:92vw;box-shadow:0 20px 50px -12px rgba(0,0,0,0.35);">
        <h3 style="margin:0 0 4px;font-size:16px;color:var(--text-main);">แก้ไขข้อมูลผู้ใช้</h3>
        <p style="margin:0 0 18px;font-size:12.5px;color:var(--text-mute);">${escapeHtml(u.display_name || u.email)} · ${roleLabel[u.user_type] || u.user_type}</p>
        <div style="display:flex;flex-direction:column;gap:12px;">
          ${isAdmin ? '' : `
          <div><label style="display:block;font-size:12px;color:var(--text-mute);margin-bottom:5px;">ชื่อ</label>
            <input id="editUserName" value="${escapeHtml(u.display_name || '')}" style="width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;background:var(--panel-2);color:var(--text-main);"></div>
          <div><label style="display:block;font-size:12px;color:var(--text-mute);margin-bottom:5px;">เบอร์โทร</label>
            <input id="editUserPhone" value="${escapeHtml(u.phone || '')}" style="width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;background:var(--panel-2);color:var(--text-main);"></div>
          `}
          <div><label style="display:block;font-size:12px;color:var(--text-mute);margin-bottom:5px;">อีเมล</label>
            <input id="editUserEmail" value="${escapeHtml(u.email || '')}" style="width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;background:var(--panel-2);color:var(--text-main);"></div>
          ${isAdmin ? '<p style="margin:0;font-size:11.5px;color:var(--text-mute);">บัญชีผู้ดูแลระบบแก้ไขได้เฉพาะอีเมล</p>' : ''}
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:20px;">
          <button class="btn-mini" style="background:var(--panel-2);color:var(--text-mute);" onclick="closeEditModal()">ยกเลิก</button>
          <button class="btn-mini btn-blue" onclick="saveUserProfile(${id})">บันทึก</button>
        </div>
      </div>`;
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeEditModal(); });
    document.body.appendChild(overlay);
  }

  function closeEditModal() {
    const el = document.getElementById('editUserOverlay');
    if (el) el.remove();
  }

  async function saveUserProfile(id) {
    const u = allUsers.find(x => x.id === id);
    if (!u) return;
    const isAdmin = u.user_type === 'admin';
    const email = document.getElementById('editUserEmail').value.trim();
    const name = isAdmin ? (u.display_name || '') : document.getElementById('editUserName').value.trim();
    const phone = isAdmin ? '' : document.getElementById('editUserPhone').value.trim();
    if (!isAdmin && !name) {
      toast('กรุณากรอกชื่อ', false);
      return;
    }
    const res = await fetch(`${API_BASE}/admin/users/${id}`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, phone }),
    });
    const data = await res.json();
    toast(data.message, data.success);
    if (data.success) { closeEditModal(); loadUsers(); }
  }

  document.getElementById('searchInput').addEventListener('input', render);
  loadUsers();
</script>
</body>
</html>
